version: '3.8'

services:
  ash:
    build: .
    container_name: ash
    restart: unless-stopped
    ports:
      - "127.0.0.1:9444:9444"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=9444
      - NODE_ENV=production
      - STORAGE_DIR=/app/data/skills_files
      - DATA_DIR=/app/data
      # 公网部署时先设为 closed，管理员认领旧数据后再按需开放注册
      - ASH_REGISTRATION=${ASH_REGISTRATION:-open}
