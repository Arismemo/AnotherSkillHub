version: '3.8'

services:
  ash:
    build: .
    container_name: ash
    restart: unless-stopped
    ports:
      - "127.0.0.1:9444:9444"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=9444
      - NODE_ENV=production
      - STORAGE_DIR=/app/data/skills_files
      - DATA_DIR=/app/data
